name: pda-admin-development

# Local check of the production image: build from source and serve it with Nginx.
#   docker compose -f deploy/compose.development.yml up --build
# App: http://127.0.0.1:18021
# The build uses .env.production (production API), the same as CodeBuild. `pnpm dev`
# keeps using the local .env.

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: pda-admin:development
    ports:
      - "127.0.0.1:18021:3000"
