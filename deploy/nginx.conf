# Static server for the Vite build inside the pda-admin container.
# Public traffic: ALB (TLS) -> shared Nginx (nginx_container) -> pda-admin:3000.
# The shared Nginx already adds X-Content-Type-Options, X-Frame-Options and
# Referrer-Policy, so they are not repeated here (nginx would send them twice).

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Writable by the unprivileged nginx user.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # The shared Nginx keeps the access log (JSON) for every request.
    access_log off;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Picked by URI so every location inherits the server-level add_header lines below
    # (a location with its own add_header would drop all of them).
    map $uri $cache_control {
        # Hashed file names change with every build, so they can be cached forever.
        ~^/assets/      "public, max-age=31536000, immutable";
        # PDF.js fonts and CMaps keep their names across builds: revalidate by ETag.
        ~^/pdf-assets/  "no-cache";
        # index.html and the rest: never stored, same as the Vite server headers.
        default         "no-store";
    }

    server {
        listen 3000;
        root /usr/share/nginx/html;

        # Generated at build time from the CSP in index.html (see deploy/Dockerfile).
        include /etc/nginx/csp-header.conf;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        # Without `always`: error responses (404 of a missing asset) are not cached.
        add_header Cache-Control $cache_control;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location /assets/ {
            try_files $uri =404;
        }

        # The PDF.js worker is an ES module (.mjs); browsers refuse module scripts sent
        # as application/octet-stream, which is what the stock mime.types gives .mjs.
        location ~ \.mjs$ {
            types { application/javascript mjs; }
            try_files $uri =404;
        }

        location /pdf-assets/ {
            try_files $uri =404;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
